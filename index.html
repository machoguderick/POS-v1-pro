                        input.value = '';
                        const clearBtn = document.querySelector('.clear-search');
                        if (clearBtn) clearBtn.style.display = 'none';
                        filterInventoryProducts('');
                        input.focus();
                    }
                };
                
                document.getElementById('adjust-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const product_id = document.getElementById('adjust-product').value;
                    const quantity_change = parseInt(document.getElementById('adjust-qty').value);
                    const type = document.getElementById('adjust-type').value;
                    const expiry_date = document.getElementById('adjust-expiry').value || null;
                    
                    if (!product_id) { showToast('Select a product', 'warning'); return; }
                    if (isNaN(quantity_change) || quantity_change === 0) { showToast('Enter non-zero quantity', 'warning'); return; }
                    
                    try {
                        await apiFetch('/api/inventory/adjust', {
                            method: 'POST',
                            body: JSON.stringify({ product_id, quantity_change, type, reason: `Expiry: ${expiry_date || 'Not set'}` })
                        });
                        
                        if (expiry_date) {
                            const product = products.find(p => p.id == product_id);
                            if (product) {
                                await apiFetch(`/api/products/${product_id}`, {
                                    method: 'PUT',
                                    body: JSON.stringify({ ...product, expiry_date })
                                });
                            }
                        }
                        
                        showToast(`✅ Stock adjusted`, 'success');
                        renderInventory();
                        products = await apiFetch('/api/products');
                    } catch (err) {
                        showToast('Error: ' + err.message, 'error');
                    }
                });
                
            } catch (err) {
                viewContainer.innerHTML = `<p class="text-red-500">❌ Error: ${err.message}</p>`;
                showToast('Failed to load inventory', 'error');
            }
        }

        window.quickAdjust = function(amount) {
            const qtyInput = document.getElementById('adjust-qty');
            if (qtyInput) {
                qtyInput.value = amount;
                qtyInput.focus();
                showToast(`Quick: ${amount > 0 ? '+' : ''}${amount}`, 'info');
            }
        };

        // ================================================================
        //  RENDER: REPORTS
        // ================================================================
        async function renderReports() {
            viewContainer.innerHTML = `<div class="text-center py-6"><div class="spinner"></div><p class="text-gray-500 mt-2">Loading reports...</p></div>`;
            try {
                const summary = await apiFetch('/api/reports/sales-summary');
                const topProducts = await apiFetch('/api/reports/top-products');
                const valuation = await apiFetch('/api/reports/inventory-valuation');
                const lowStock = await apiFetch('/api/reports/low-stock');
                
                const expiredProducts = products.filter(p => isProductExpired(p) && p.stock > 0);
                const expiringProducts = products.filter(p => isProductExpiringSoon(p, 5) && !isProductExpired(p) && p.stock > 0);

                viewContainer.innerHTML = `
                    <div class="fade-in-up">
                        <h2 class="text-lg font-bold mb-2">📈 Reports</h2>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-2">
                            <div class="card">
                                <h3 class="font-semibold text-sm mb-1.5">📊 Sales Summary</h3>
                                <div class="overflow-x-auto max-h-44 overflow-y-auto">
                                    <table class="min-w-full text-sm">
                                        <thead><tr><th class="text-left">Date</th><th class="text-right font-bold">Sales</th></tr></thead>
                                        <tbody>
                                            ${summary.map(d => `<tr><td>${d.date}</td><td class="text-right font-bold">KES ${d.total_sales.toFixed(2)}</td></tr>`).join('')}
                                            ${summary.length === 0 ? '<tr><td colspan="2" class="text-center py-2 text-gray-500">No data</td></tr>' : ''}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="card">
                                <h3 class="font-semibold text-sm mb-1.5">🏆 Top Products</h3>
                                <div class="space-y-0.5 max-h-44 overflow-y-auto">
                                    ${topProducts.map(p => `
                                        <div class="flex justify-between items-center py-0.5 border-b border-gray-100 dark:border-gray-700 last:border-0">
                                            <span class="font-medium text-sm">${p.name}</span>
                                            <span class="font-bold text-green-600 dark:text-green-400 text-sm">KES ${p.revenue.toFixed(2)}</span>
                                        </div>
                                    `).join('')}
                                    ${topProducts.length === 0 ? '<p class="text-gray-500 text-center py-2 text-sm">No data</p>' : ''}
                                </div>
                            </div>
                            <div class="card">
                                <h3 class="font-semibold text-sm mb-1.5">💰 Inventory Value</h3>
                                <div class="space-y-0.5 max-h-44 overflow-y-auto">
                                    ${valuation.map(v => `
                                        <div class="flex justify-between items-center py-0.5 border-b border-gray-100 dark:border-gray-700 last:border-0">
                                            <span class="text-sm">${v.category || 'Uncategorized'}</span>
                                            <span class="font-bold text-sm">KES ${v.total_value.toFixed(2)}</span>
                                        </div>
                                    `).join('')}
                                    ${valuation.length === 0 ? '<p class="text-gray-500 text-center py-2 text-sm">No data</p>' : ''}
                                </div>
                            </div>
                            <div class="card">
                                <h3 class="font-semibold text-sm mb-1.5 text-red-600">⚠️ Low Stock</h3>
                                <div class="space-y-0.5 max-h-44 overflow-y-auto">
                                    ${lowStock.map(p => `
                                        <div class="flex justify-between items-center py-0.5 border-b border-gray-100 dark:border-gray-700 last:border-0">
                                            <span class="text-sm">${p.name}</span>
                                            <span class="font-bold text-red-600 text-sm">${p.stock}</span>
                                        </div>
                                    `).join('')}
                                    ${lowStock.length === 0 ? '<p class="text-gray-500 text-center py-2 text-sm">No low stock items</p>' : ''}
                                </div>
                            </div>
                            <div class="card">
                                <h3 class="font-semibold text-sm mb-1.5 text-red-600">🚫 Expired Products</h3>
                                ${expiredProducts.length > 0 ? `
                                    <div class="space-y-0.5 max-h-44 overflow-y-auto">
                                        ${expiredProducts.map(p => `
                                            <div class="flex justify-between items-center py-0.5 border-b border-gray-100 dark:border-gray-700 last:border-0">
                                                <span class="text-sm">${p.name}</span>
                                                <span class="font-bold text-red-600 text-sm">${formatExpiryDate(p.expiry_date)}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : '<p class="text-gray-500 text-center py-2 text-sm">No expired products</p>'}
                            </div>
                            <div class="card">
                                <h3 class="font-semibold text-sm mb-1.5 text-orange-500">🔥 Expiring Soon</h3>
                                ${expiringProducts.length > 0 ? `
                                    <div class="space-y-0.5 max-h-44 overflow-y-auto">
                                        ${expiringProducts.map(p => `
                                            <div class="flex justify-between items-center py-0.5 border-b border-gray-100 dark:border-gray-700 last:border-0">
                                                <span class="text-sm">${p.name}</span>
                                                <span class="font-bold text-orange-500 text-sm">${formatExpiryDate(p.expiry_date)} (${getDaysUntilExpiry(p.expiry_date)}d)</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : '<p class="text-gray-500 text-center py-2 text-sm">No products expiring soon</p>'}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                viewContainer.innerHTML = `<p class="text-red-500">❌ Error: ${err.message}</p>`;
                showToast('Failed to load reports', 'error');
            }
        }

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                if (currentView === 'sales') checkout();
            }
            if (e.key === 'Escape') {
                const search = document.getElementById('product-search');
                if (search) { search.value = ''; search.blur(); }
                const suggestions = document.getElementById('search-suggestions');
                if (suggestions) suggestions.classList.add('hidden');
                const form = document.getElementById('productFormContainer');
                if (form && form.style.display !== 'none') {
                    form.style.display = 'none';
                }
            }
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                const searchInput = document.getElementById('product-search-input');
                if (searchInput) {
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        console.log('🏪 POS v1 Pro v1.0 loaded');
        console.log('🌙 Dark mode: ' + (document.documentElement.classList.contains('dark') ? 'ON' : 'OFF'));
        console.log('📦 Wholesale units: bale (1, 1/2, 1/4), dozen (1, 1/2), carton (1, 1/2), packet, outer');
        console.log('🔍 Search bar in products - press Ctrl+F to focus');
        console.log('📱 Full screen products section');
        console.log('📜 Transactions show products sold with quantities');
        console.log('🔍 Inventory search bar added');
    </script>
</body>
</html>
